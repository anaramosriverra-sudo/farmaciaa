<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#ff0a41"/>
    <title>FARM SJB | Sin conexión</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #323232; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; padding: 16px; box-sizing: border-box; }
        .card { text-align: center; max-width: 420px; }
        .icon { width: 84px; height: 84px; border-radius: 50%; background: #ff0a41; margin: 0 auto 24px;
                display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 700; line-height: 1; }
        h1 { font-size: 1.5rem; margin: 0 0 8px; }
        p { color: rgba(255,255,255,.7); margin: 0 0 24px; line-height: 1.5; }
        button { background: #ff0a41; color: #fff; border: 0; border-radius: 8px; padding: 10px 22px; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">+</div>
    <h1>Sin conexión</h1>
    <p>No se pudo conectar con el sistema de la Farmacia San Juan. Revisa tu conexión a internet o que el servidor esté encendido.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
</div>
</body>
</html>
